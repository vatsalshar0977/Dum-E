; Pytest configuration for B.U.D.-E.
;
; Two jobs:
;   1. Pin the rootdir to the repository, so pytest stops guessing (and so the root
;      `conftest.py`, which puts the repository on sys.path, is actually loaded even when you
;      pass an absolute path to `tests/` from a different directory).
;   2. `pythonpath = .` does the same job natively on pytest >= 7, as a belt-and-braces
;      companion to conftest.py (which covers older pytest).
;
; `testpaths` means a bare `python -m pytest` collects tests/ and nothing else - the firmware
; stubs in tests/firmware_host are headers and one harness, not test modules.

[pytest]
testpaths = tests
pythonpath = .
